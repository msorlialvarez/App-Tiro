<style>
  :root{
    --orange:#F26522; --orange-dark:#ea580c; --black:#171717;
    --grey:#737373; --line:#e5e5e5; --bg:#fafafa;
    --green:#16a34a; --green-bg:#f0fdf4; --green-border:#86efac;
    --red:#b91c1c; --red-bg:#fef2f2;
    --blue:#2563eb; --purple:#9333ea;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#171717;-webkit-tap-highlight-color:transparent;}
  .header{background:linear-gradient(to right,var(--orange-dark),var(--orange));color:#fff;padding:16px;position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .header p{margin:2px 0 0;color:#ffe4cc;font-size:12px;}
  .main{padding:16px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card-flat{padding:0;overflow:hidden;}
  .label{font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:8px;}
  .grid{display:grid;gap:8px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  button{font-family:inherit;}
  .player-btn{padding:9px 4px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:#404040;cursor:pointer;line-height:1.25;}
  .player-btn.active{border-color:var(--orange);background:#fff7ed;color:#c2410c;}
  input[type=text],input[type=number]{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;width:100%;}
  .row{display:flex;gap:8px;}
  .flex-1{flex:1;}
  .btn-add{background:var(--black);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:20px;font-weight:700;cursor:pointer;}
  .serie-btn{position:relative;padding:9px 4px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:center;}
  .serie-btn.active{border-color:var(--orange);background:#fff7ed;}
  .serie-num{font-size:13px;font-weight:700;}
  .serie-tipo{font-size:10px;font-weight:700;margin-top:1px;}
  .serie-tipo.t2{color:var(--blue);}
  .serie-tipo.t3{color:var(--purple);}
  .check-badge{position:absolute;top:-6px;right:-6px;background:#22c55e;color:#fff;border-radius:999px;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .serie-title{font-weight:700;}
  .objetivo-sub{font-size:12px;color:#a3a3a3;margin-top:2px;}
  .big-frac{font-size:24px;font-weight:900;text-align:right;}
  .big-pct{font-size:12px;font-weight:700;text-align:right;}
  .big-pct.reached{color:var(--green);}
  .big-pct.idle{color:#a3a3a3;}
  .tipo-toggle{padding:9px;border-radius:10px;font-weight:700;font-size:13px;border:none;cursor:pointer;background:#f5f5f5;color:#525252;}
  .tipo-toggle.t2.active{background:var(--blue);color:#fff;}
  .tipo-toggle.t3.active{background:var(--purple);color:#fff;}
  .circles{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
  .circle{width:22px;height:22px;border-radius:999px;border:2px solid #d4d4d4;background:#fff;}
  .circle.made{background:#22c55e;border-color:#22c55e;}
  .circle.miss{background:#f87171;border-color:#f87171;}
  .reached-banner{background:var(--green-bg);border:1px solid var(--green-border);color:#15803d;font-size:13px;border-radius:10px;padding:9px 12px;margin-bottom:12px;font-weight:700;text-align:center;}
  .numpad-block{margin-bottom:14px;}
  .numpad-label{font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;margin-bottom:6px;}
  .numpad-btn{aspect-ratio:1;border-radius:10px;border:none;background:#f5f5f5;color:#404040;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .numpad-btn.ac.active{background:var(--green);color:#fff;}
  .numpad-btn.int.active{background:var(--orange);color:#fff;}
  .numpad-btn:disabled{opacity:.3;}
  .actions-row{display:flex;gap:8px;}
  .btn{border-radius:10px;font-weight:700;cursor:pointer;padding:10px;font-size:14px;border:none;}
  .btn-outline{background:#fff;border:1px solid #d4d4d4;color:#171717;}
  .btn-dark{background:var(--black);color:#fff;}
  .btn-dark:disabled,.btn-outline:disabled{opacity:.4;}
  .saved-msg{text-align:center;color:var(--green);font-size:12px;font-weight:700;margin-top:8px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead{background:var(--black);color:#fff;}
  th,td{padding:8px;text-align:center;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;font-weight:700;}
  tbody tr{border-top:1px solid #f5f5f5;cursor:pointer;}
  tbody tr.active-row{background:#fff7ed;}
  .cell-ok{background:var(--green-bg);color:#15803d;font-weight:700;}
  .cell-bad{background:var(--red-bg);color:var(--red);font-weight:700;}
  .cell-empty{color:#a3a3a3;}
  .summary-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:700;font-size:14px;background:none;border:none;cursor:pointer;}
  .settings-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;background:none;border:none;cursor:pointer;margin-bottom:8px;padding:0;}
  .settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;}
  .settings-grid label{font-size:11px;color:var(--grey);display:block;margin-bottom:2px;}
  .btn-export{width:100%;background:var(--orange);color:#fff;padding:10px;border-radius:10px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;}
  .btn-clear{width:100%;background:none;border:none;color:#a3a3a3;font-size:11px;padding:4px;cursor:pointer;}
  .error-banner{background:var(--red-bg);border:1px solid #fca5a5;color:var(--red);font-size:12px;border-radius:10px;padding:8px 12px;}
</style>
</head>
<body>
<div class="header">
  <h1>PLANTILLA DE TIRO</h1>
  <p>Valencia Basket · registro en directo</p>
</div>
<div class="main" id="root"></div>

<script>
/* ---------- Minimal dependency-free XLSX writer ---------- */
/* Produces a real, styled .xlsx (ZIP, stored/uncompressed) using only plain JS. */

var XlsxWriter = (function () {
  "use strict";

  // ---------- CRC32 ----------
  var CRC_TABLE = (function () {
    var table = [];
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) {
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      table[n] = c >>> 0;
    }
    return table;
  })();
  function crc32(bytes) {
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function strToUtf8Bytes(str) {
    return new TextEncoder().encode(str);
  }

  // ---------- little-endian helpers ----------
  function u16(v) { return [v & 0xFF, (v >>> 8) & 0xFF]; }
  function u32(v) { return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }

  // ---------- ZIP (store method, no compression) ----------
  function buildZip(files) {
    // files: [{name: string, data: Uint8Array}]
    var localParts = [];
    var centralParts = [];
    var offset = 0;
    var dosTime = 0, dosDate = 0x21; // fixed dummy date/time, valid enough for Excel

    files.forEach(function (f) {
      var nameBytes = strToUtf8Bytes(f.name);
      var data = f.data;
      var crc = crc32(data);
      var size = data.length;

      var localHeader = []
        .concat(u32(0x04034b50))
        .concat(u16(20))        // version needed
        .concat(u16(0))         // flags
        .concat(u16(0))         // compression = store
        .concat(u16(dosTime))
        .concat(u16(dosDate))
        .concat(u32(crc))
        .concat(u32(size))      // compressed size
        .concat(u32(size))      // uncompressed size
        .concat(u16(nameBytes.length))
        .concat(u16(0));        // extra field length

      var localHeaderBytes = new Uint8Array(localHeader);
      var localEntry = new Uint8Array(localHeaderBytes.length + nameBytes.length + data.length);
      localEntry.set(localHeaderBytes, 0);
      localEntry.set(nameBytes, localHeaderBytes.length);
      localEntry.set(data, localHeaderBytes.length + nameBytes.length);
      localParts.push(localEntry);

      var centralHeader = []
        .concat(u32(0x02014b50))
        .concat(u16(20))        // version made by
        .concat(u16(20))        // version needed
        .concat(u16(0))         // flags
        .concat(u16(0))         // compression
        .concat(u16(dosTime))
        .concat(u16(dosDate))
        .concat(u32(crc))
        .concat(u32(size))
        .concat(u32(size))
        .concat(u16(nameBytes.length))
        .concat(u16(0))         // extra length
        .concat(u16(0))         // comment length
        .concat(u16(0))         // disk number start
        .concat(u16(0))         // internal attrs
        .concat(u32(0))         // external attrs
        .concat(u32(offset));   // local header offset

      var centralHeaderBytes = new Uint8Array(centralHeader);
      var centralEntry = new Uint8Array(centralHeaderBytes.length + nameBytes.length);
      centralEntry.set(centralHeaderBytes, 0);
      centralEntry.set(nameBytes, centralHeaderBytes.length);
      centralParts.push(centralEntry);

      offset += localEntry.length;
    });

    var centralSize = centralParts.reduce(function (a, p) { return a + p.length; }, 0);
    var centralOffset = offset;

    var eocd = []
      .concat(u32(0x06054b50))
      .concat(u16(0))              // disk number
      .concat(u16(0))              // disk with central dir
      .concat(u16(files.length))   // entries this disk
      .concat(u16(files.length))   // total entries
      .concat(u32(centralSize))
      .concat(u32(centralOffset))
      .concat(u16(0));             // comment length
    var eocdBytes = new Uint8Array(eocd);

    var totalSize = offset + centralSize + eocdBytes.length;
    var out = new Uint8Array(totalSize);
    var pos = 0;
    localParts.forEach(function (p) { out.set(p, pos); pos += p.length; });
    centralParts.forEach(function (p) { out.set(p, pos); pos += p.length; });
    out.set(eocdBytes, pos);
    return out;
  }

  // ---------- XML escaping ----------
  function xesc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------- column letter ----------
  function colLetter(n) { // 1-indexed
    var s = "";
    while (n > 0) {
      var r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }
  function cellRef(col, row) { return colLetter(col) + row; }

  return {
    crc32: crc32,
    buildZip: buildZip,
    strToUtf8Bytes: strToUtf8Bytes,
    xesc: xesc,
    colLetter: colLetter,
    cellRef: cellRef
  };
})();

if (typeof module !== "undefined") { module.exports = XlsxWriter; }


/* Builds a styled .xlsx (Uint8Array) for the shooting tracker, using XlsxWriter core (no deps). */
var buildShootingXlsx = (function () {
  "use strict";
  var XW = (typeof XlsxWriter !== "undefined") ? XlsxWriter : require("./xlsx-core.js");

  var SERIES_COUNT = 12;

  function buildStylesXml() {
    // Fonts
    var fonts = [
      '<font><sz val="10"/><color rgb="FF1A1A1A"/><name val="Arial"/></font>',                          // 0 default
      '<font><b/><sz val="14"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>',                       // 1 title
      '<font><b/><sz val="9"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>',                        // 2 group header
      '<font><b/><sz val="8"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>',                        // 3 sub header
      '<font><b/><sz val="9.5"/><color rgb="FF1A1A1A"/><name val="Arial"/></font>',                      // 4 player name / total bold
      '<font><sz val="9"/><color rgb="FF1A1A1A"/><name val="Arial"/></font>',                            // 5 normal
      '<font><b/><sz val="9"/><color rgb="FF006100"/><name val="Arial"/></font>',                        // 6 green pct
      '<font><b/><sz val="9"/><color rgb="FF9C0006"/><name val="Arial"/></font>',                        // 7 red pct
      '<font><b/><sz val="9"/><color rgb="FF1F4E78"/><name val="Arial"/></font>',                        // 8 tipo T2
      '<font><b/><sz val="9"/><color rgb="FF6B21A8"/><name val="Arial"/></font>',                        // 9 tipo T3
      '<font><i/><sz val="8.5"/><color rgb="FF737373"/><name val="Arial"/></font>',                      // 10 legend
      '<font><sz val="9"/><color rgb="FFAAAAAA"/><name val="Arial"/></font>'                             // 11 empty dash
    ];

    // Fills (0 and 1 are reserved defaults per OOXML spec)
    var fills = [
      '<fill><patternFill patternType="none"/></fill>',
      '<fill><patternFill patternType="gray125"/></fill>',
      '<fill><patternFill patternType="solid"><fgColor rgb="FFF26522"/><bgColor indexed="64"/></patternFill></fill>',   // 2 orange (title)
      '<fill><patternFill patternType="solid"><fgColor rgb="FF1A1A1A"/><bgColor indexed="64"/></patternFill></fill>',   // 3 black (group header)
      '<fill><patternFill patternType="solid"><fgColor rgb="FF3D3D3D"/><bgColor indexed="64"/></patternFill></fill>',   // 4 dark grey (sub header)
      '<fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/><bgColor indexed="64"/></patternFill></fill>',   // 5 light grey (totals)
      '<fill><patternFill patternType="solid"><fgColor rgb="FFC6EFCE"/><bgColor indexed="64"/></patternFill></fill>',   // 6 green
      '<fill><patternFill patternType="solid"><fgColor rgb="FFFFC7CE"/><bgColor indexed="64"/></patternFill></fill>'    // 7 red
    ];

    var thin = '<left style="thin"><color rgb="FFD9D9D9"/></left><right style="thin"><color rgb="FFD9D9D9"/></right><top style="thin"><color rgb="FFD9D9D9"/></top><bottom style="thin"><color rgb="FFD9D9D9"/></bottom>';
    var borders = [
      '<border><left/><right/><top/><bottom/><diagonal/></border>',                 // 0 none
      '<border>' + thin + '<diagonal/></border>'                                    // 1 thin all
    ];

    var numFmts = '<numFmts count="1"><numFmt numFmtId="164" formatCode="0%"/></numFmts>';

    // cellXfs — index matters, referenced by cell "s" attribute
    var xfs = [
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>', // 0 default
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="left" vertical="center" indent="1"/></xf>', // 1 title
      '<xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>', // 2 group header
      '<xf numFmtId="0" fontId="3" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>', // 3 sub header
      '<xf numFmtId="0" fontId="4" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" indent="1"/></xf>', // 4 player name
      '<xf numFmtId="0" fontId="5" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 5 number cell
      '<xf numFmtId="164" fontId="5" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 6 pct neutral
      '<xf numFmtId="164" fontId="6" fillId="6" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 7 pct green
      '<xf numFmtId="164" fontId="7" fillId="7" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 8 pct red
      '<xf numFmtId="0" fontId="4" fillId="5" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 9 total number
      '<xf numFmtId="164" fontId="4" fillId="5" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 10 total pct neutral
      '<xf numFmtId="164" fontId="6" fillId="6" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 11 total pct green (same visual as 7, kept separate for clarity)
      '<xf numFmtId="164" fontId="7" fillId="7" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 12 total pct red
      '<xf numFmtId="0" fontId="8" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 13 tipo T2
      '<xf numFmtId="0" fontId="9" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 14 tipo T3
      '<xf numFmtId="0" fontId="11" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>', // 15 empty dash
      '<xf numFmtId="0" fontId="10" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center" indent="1"/></xf>', // 16 legend text
      '<xf numFmtId="0" fontId="4" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' // 17 series-count number (bold centered)
    ];

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      numFmts +
      '<fonts count="' + fonts.length + '">' + fonts.join("") + '</fonts>' +
      '<fills count="' + fills.length + '">' + fills.join("") + '</fills>' +
      '<borders count="' + borders.length + '">' + borders.join("") + '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="' + xfs.length + '">' + xfs.join("") + '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  var STYLE = {
    TITLE: 1, GROUP: 2, SUB: 3, NAME: 4, NUM: 5,
    PCT_NEUTRAL: 6, PCT_GREEN: 7, PCT_RED: 8,
    TOTAL_NUM: 9, TOTAL_PCT_NEUTRAL: 10, TOTAL_PCT_GREEN: 11, TOTAL_PCT_RED: 12,
    TIPO_T2: 13, TIPO_T3: 14, DASH: 15, LEGEND: 16, SERIES_NUM: 17
  };

  function cellStr(colLetter, row, style, text) {
    return '<c r="' + colLetter + row + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' + XW.xesc(text) + '</t></is></c>';
  }
  function cellNum(colLetter, row, style, num) {
    return '<c r="' + colLetter + row + '" s="' + style + '"><v>' + num + '</v></c>';
  }
  function cellBlank(colLetter, row, style) {
    return '<c r="' + colLetter + row + '" s="' + style + '"/>';
  }

  function buildSheetXml(state) {
    var players = state.players;
    var objetivos = state.objetivos;
    var data = state.data;

    var SERIES = [];
    for (var i = 1; i <= SERIES_COUNT; i++) SERIES.push("Serie " + i);

    // column layout
    // A: Jugadora, B: Series tiradas
    // then 12 series x 4 cols (Tipo, Ac, Int, %)
    // then Total T2 (Ac,Int,%), Total T3 (Ac,Int,%), Total General (Ac,Int,%)
    var NAME_COL = 1, COUNT_COL = 2;
    var SERIES_START = 3;
    var SERIES_END = SERIES_START + SERIES_COUNT * 4 - 1;
    var TOT_T2_START = SERIES_END + 1;
    var TOT_T3_START = TOT_T2_START + 3;
    var TOT_GEN_START = TOT_T3_START + 3;
    var LAST_COL = TOT_GEN_START + 2;

    var ROW_TITLE = 1, ROW_LEGEND = 2, ROW_GROUP = 3, ROW_SUB = 4, FIRST_DATA_ROW = 5;
    var lastDataRow = FIRST_DATA_ROW + players.length - 1;

    var rowsXml = [];
    var merges = [];

    // ---- row 1: title ----
    var titleCells = cellStr("A", ROW_TITLE, STYLE.TITLE, "PLANTILLA DE TIRO \u00b7 VALENCIA BASKET");
    for (var tc = 2; tc <= LAST_COL; tc++) titleCells += cellBlank(XW.colLetter(tc), ROW_TITLE, STYLE.TITLE);
    rowsXml.push('<row r="' + ROW_TITLE + '" ht="22">' + titleCells + '</row>');
    merges.push("A" + ROW_TITLE + ":" + XW.colLetter(LAST_COL) + ROW_TITLE);

    // ---- row 2: legend ----
    var legendTxt = "Verde = objetivo cumplido \u00b7 Rojo = objetivo no alcanzado \u00b7 Objetivo T2: " +
      Math.round(objetivos.t2 * 100) + "% \u00b7 Objetivo T3: " + Math.round(objetivos.t3 * 100) + "%";
    var legendCells = cellStr("A", ROW_LEGEND, STYLE.LEGEND, legendTxt);
    for (var lc = 2; lc <= LAST_COL; lc++) legendCells += cellBlank(XW.colLetter(lc), ROW_LEGEND, STYLE.LEGEND);
    rowsXml.push('<row r="' + ROW_LEGEND + '" ht="14">' + legendCells + '</row>');
    merges.push("A" + ROW_LEGEND + ":" + XW.colLetter(LAST_COL) + ROW_LEGEND);

    // ---- row 3+4: headers ----
    var groupCells = "";
    var subCells = "";

    // Jugadora (vertical merge rows 3-4)
    groupCells += cellStr(XW.colLetter(NAME_COL), ROW_GROUP, STYLE.GROUP, "JUGADORA");
    merges.push(XW.cellRef(NAME_COL, ROW_GROUP) + ":" + XW.cellRef(NAME_COL, ROW_SUB));
    subCells += cellBlank(XW.colLetter(NAME_COL), ROW_SUB, STYLE.GROUP);

    groupCells += cellStr(XW.colLetter(COUNT_COL), ROW_GROUP, STYLE.GROUP, "SERIES TIRADAS");
    merges.push(XW.cellRef(COUNT_COL, ROW_GROUP) + ":" + XW.cellRef(COUNT_COL, ROW_SUB));
    subCells += cellBlank(XW.colLetter(COUNT_COL), ROW_SUB, STYLE.GROUP);

    var col = SERIES_START;
    SERIES.forEach(function (label) {
      groupCells += cellStr(XW.colLetter(col), ROW_GROUP, STYLE.GROUP, label);
      for (var k = 1; k < 4; k++) groupCells += cellBlank(XW.colLetter(col + k), ROW_GROUP, STYLE.GROUP);
      merges.push(XW.cellRef(col, ROW_GROUP) + ":" + XW.cellRef(col + 3, ROW_GROUP));
      subCells += cellStr(XW.colLetter(col), ROW_SUB, STYLE.SUB, "Tipo");
      subCells += cellStr(XW.colLetter(col + 1), ROW_SUB, STYLE.SUB, "Ac.");
      subCells += cellStr(XW.colLetter(col + 2), ROW_SUB, STYLE.SUB, "Int.");
      subCells += cellStr(XW.colLetter(col + 3), ROW_SUB, STYLE.SUB, "%");
      col += 4;
    });

    [[TOT_T2_START, "TOTAL T2"], [TOT_T3_START, "TOTAL T3"], [TOT_GEN_START, "TOTAL GENERAL"]].forEach(function (pair) {
      var start = pair[0], label = pair[1];
      groupCells += cellStr(XW.colLetter(start), ROW_GROUP, STYLE.GROUP, label);
      groupCells += cellBlank(XW.colLetter(start + 1), ROW_GROUP, STYLE.GROUP);
      groupCells += cellBlank(XW.colLetter(start + 2), ROW_GROUP, STYLE.GROUP);
      merges.push(XW.cellRef(start, ROW_GROUP) + ":" + XW.cellRef(start + 2, ROW_GROUP));
      subCells += cellStr(XW.colLetter(start), ROW_SUB, STYLE.SUB, "Ac.");
      subCells += cellStr(XW.colLetter(start + 1), ROW_SUB, STYLE.SUB, "Int.");
      subCells += cellStr(XW.colLetter(start + 2), ROW_SUB, STYLE.SUB, "%");
    });

    rowsXml.push('<row r="' + ROW_GROUP + '" ht="20">' + groupCells + '</row>');
    rowsXml.push('<row r="' + ROW_SUB + '" ht="14">' + subCells + '</row>');

    // ---- data rows ----
    function totalsFor(playerId, tipo) {
      var pdata = data[playerId] || {};
      var ac = 0, int = 0;
      Object.keys(pdata).forEach(function (k) {
        var v = pdata[k];
        if (v.tipo === tipo) { ac += v.ac; int += v.int; }
      });
      return { ac: ac, int: int, pct: int > 0 ? ac / int : null };
    }

    players.forEach(function (p, idx) {
      var row = FIRST_DATA_ROW + idx;
      var pdata = data[p.id] || {};

      // pase 1: solo calcular cuántas series tiene tiradas (sin escribir celdas todavía,
      // para poder mantener las celdas de la fila en estricto orden de columna A,B,C,D...)
      var seriesCount = 0;
      SERIES.forEach(function (label) {
        if (pdata[label]) seriesCount++;
      });

      var cells = "";
      cells += cellStr(XW.colLetter(NAME_COL), row, STYLE.NAME, p.name);
      cells += cellNum(XW.colLetter(COUNT_COL), row, STYLE.SERIES_NUM, seriesCount);

      var c2 = SERIES_START;
      SERIES.forEach(function (label) {
        var v = pdata[label];
        var tipoCol = XW.colLetter(c2), acCol = XW.colLetter(c2 + 1), intCol = XW.colLetter(c2 + 2), pctCol = XW.colLetter(c2 + 3);
        if (v) {
          var tipoStyle = v.tipo === "T2" ? STYLE.TIPO_T2 : STYLE.TIPO_T3;
          cells += cellStr(tipoCol, row, tipoStyle, v.tipo);
          cells += cellNum(acCol, row, STYLE.NUM, v.ac);
          cells += cellNum(intCol, row, STYLE.NUM, v.int);
          var pctVal = v.int > 0 ? v.ac / v.int : 0;
          var target = v.tipo === "T2" ? objetivos.t2 : objetivos.t3;
          var pctStyle = v.int === 0 ? STYLE.PCT_NEUTRAL : (pctVal >= target ? STYLE.PCT_GREEN : STYLE.PCT_RED);
          cells += cellNum(pctCol, row, pctStyle, pctVal);
        } else {
          cells += cellStr(tipoCol, row, STYLE.DASH, "\u2014");
          cells += cellStr(acCol, row, STYLE.DASH, "\u2014");
          cells += cellStr(intCol, row, STYLE.DASH, "\u2014");
          cells += cellStr(pctCol, row, STYLE.DASH, "\u2014");
        }
        c2 += 4;
      });

      function totalCells(start, tot, obj, colorize) {
        var acCol = XW.colLetter(start), intCol = XW.colLetter(start + 1), pctCol = XW.colLetter(start + 2);
        var s = cellNum(acCol, row, STYLE.TOTAL_NUM, tot.ac) + cellNum(intCol, row, STYLE.TOTAL_NUM, tot.int);
        if (tot.int === 0) {
          s += cellStr(pctCol, row, STYLE.TOTAL_PCT_NEUTRAL, "\u2014");
        } else if (!colorize) {
          s += cellNum(pctCol, row, STYLE.TOTAL_PCT_NEUTRAL, tot.pct);
        } else {
          var style = tot.pct >= obj ? STYLE.TOTAL_PCT_GREEN : STYLE.TOTAL_PCT_RED;
          s += cellNum(pctCol, row, style, tot.pct);
        }
        return s;
      }

      var t2 = totalsFor(p.id, "T2"), t3 = totalsFor(p.id, "T3");
      var genAc = t2.ac + t3.ac, genInt = t2.int + t3.int;
      var gen = { ac: genAc, int: genInt, pct: genInt > 0 ? genAc / genInt : null };

      cells += totalCells(TOT_T2_START, t2, objetivos.t2, true);
      cells += totalCells(TOT_T3_START, t3, objetivos.t3, true);
      cells += totalCells(TOT_GEN_START, gen, null, false);

      rowsXml.push('<row r="' + row + '" ht="15">' + cells + '</row>');
    });

    // ---- columns widths ----
    var colsXml = '<cols>';
    colsXml += '<col min="' + NAME_COL + '" max="' + NAME_COL + '" width="24" customWidth="1"/>';
    colsXml += '<col min="' + COUNT_COL + '" max="' + COUNT_COL + '" width="10" customWidth="1"/>';
    colsXml += '<col min="' + SERIES_START + '" max="' + LAST_COL + '" width="6.2" customWidth="1"/>';
    colsXml += '</cols>';

    var mergeXml = '<mergeCells count="' + merges.length + '">' +
      merges.map(function (m) { return '<mergeCell ref="' + m + '"/>'; }).join("") +
      '</mergeCells>';

    var freezeCol = XW.colLetter(SERIES_START);
    var paneXml = '<pane xSplit="2" ySplit="' + ROW_SUB + '" topLeftCell="' + freezeCol + (FIRST_DATA_ROW) + '" activePane="bottomRight" state="frozen"/>';

    var dimension = "A1:" + XW.colLetter(LAST_COL) + lastDataRow;

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<dimension ref="' + dimension + '"/>' +
      '<sheetViews><sheetView workbookViewId="0" showGridLines="0">' + paneXml + '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      colsXml +
      '<sheetData>' + rowsXml.join("") + '</sheetData>' +
      mergeXml +
      '</worksheet>';
  }

  function buildWorkbookXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="Tiro" sheetId="1" r:id="rId1"/></sheets>' +
      '</workbook>';
  }

  function buildContentTypesXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';
  }

  function buildRootRelsXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
  }

  function buildWorkbookRelsXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';
  }

  function build(state) {
    var files = [
      { name: "[Content_Types].xml", data: XW.strToUtf8Bytes(buildContentTypesXml()) },
      { name: "_rels/.rels", data: XW.strToUtf8Bytes(buildRootRelsXml()) },
      { name: "xl/workbook.xml", data: XW.strToUtf8Bytes(buildWorkbookXml()) },
      { name: "xl/_rels/workbook.xml.rels", data: XW.strToUtf8Bytes(buildWorkbookRelsXml()) },
      { name: "xl/styles.xml", data: XW.strToUtf8Bytes(buildStylesXml()) },
      { name: "xl/worksheets/sheet1.xml", data: XW.strToUtf8Bytes(buildSheetXml(state)) }
    ];
    return XW.buildZip(files);
  }

  return build;
})();

if (typeof module !== "undefined") { module.exports = buildShootingXlsx; }

</script>

<script>
"use strict";

var STORAGE_KEY = "shooting_tracker_v1";
var DEFAULT_PLAYER_NAMES = [
  "Alexis Peterson (1)", "Virag Takacs-Kiss (2)", "Elizabeth Balogun (4)",
  "Elena Buenavida (6)", "Kendra Chery (7)", "María Araújo (8)",
  "Leticia Romero (10)", "Kamila Borkowska (11)", "Helena Pueyo (13)",
  "Raquel Carrera (14)", "Marta Suárez (16)", "Alicia Flórez (18)",
  "Alisia Jenkins (24)"
];
var SERIES = [];
for (var i = 1; i <= 12; i++) SERIES.push("Serie " + i);
var NUMBERS = [];
for (var n = 0; n <= 10; n++) NUMBERS.push(n);

var state = {
  players: DEFAULT_PLAYER_NAMES.map(function (name, i) { return { id: "p" + i, name: name }; }),
  data: {},
  objetivos: { t2: 0.7, t3: 0.5 },
  selectedPlayerId: null,
  serieIdx: 0,
  acInput: 0,
  intInput: 10,
  currentTipo: "T2",
  showSettings: false,
  showTable: true,
  saveStatus: "idle",
  storageError: false
};

// ---------- persistence ----------
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed.players && parsed.players.length) state.players = parsed.players;
      if (parsed.data) state.data = parsed.data;
      if (parsed.objetivos) state.objetivos = parsed.objetivos;
      if (parsed.selectedPlayerId) state.selectedPlayerId = parsed.selectedPlayerId;
      if (parsed.currentTipo) state.currentTipo = parsed.currentTipo;
    }
  } catch (e) { /* sin datos guardados todavía */ }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      players: state.players, data: state.data, objetivos: state.objetivos,
      selectedPlayerId: state.selectedPlayerId, currentTipo: state.currentTipo
    }));
    state.storageError = false;
  } catch (e) { state.storageError = true; }
}

// ---------- helpers ----------
function currentSerieLabel() { return SERIES[state.serieIdx]; }
function target() { return state.currentTipo === "T2" ? state.objetivos.t2 : state.objetivos.t3; }
function pct() { return state.intInput > 0 ? state.acInput / state.intInput : 0; }
function reached() { return state.intInput > 0 && pct() >= target(); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function totalsFor(playerId, tipo) {
  var pdata = state.data[playerId] || {};
  var ac = 0, int = 0;
  Object.keys(pdata).forEach(function (k) {
    var v = pdata[k];
    if (v.tipo === tipo) { ac += v.ac; int += v.int; }
  });
  return { ac: ac, int: int, pct: int > 0 ? ac / int : null };
}
function generalFor(playerId) {
  var t2 = totalsFor(playerId, "T2"), t3 = totalsFor(playerId, "T3");
  var ac = t2.ac + t3.ac, int = t2.int + t3.int;
  return { ac: ac, int: int, pct: int > 0 ? ac / int : null };
}

function loadSerieValues() {
  if (!state.selectedPlayerId) { state.acInput = 0; state.intInput = 10; return; }
  var existing = (state.data[state.selectedPlayerId] || {})[currentSerieLabel()];
  if (existing) {
    state.acInput = existing.ac; state.intInput = existing.int; state.currentTipo = existing.tipo;
  } else {
    state.acInput = 0; state.intInput = 10;
  }
}

// ---------- actions ----------
function selectPlayer(id) { state.selectedPlayerId = id; loadSerieValues(); saveState(); render(); }
function addPlayer() {
  var input = document.getElementById("newPlayerInput");
  var name = (input && input.value ? input.value : "").trim();
  if (!name) return;
  var id = "p" + Date.now();
  state.players.push({ id: id, name: name });
  state.selectedPlayerId = id;
  loadSerieValues();
  saveState();
  render();
}
function selectSerie(i) { state.serieIdx = i; loadSerieValues(); render(); }
function setTipo(t) { state.currentTipo = t; saveState(); render(); }
function setAc(v) { state.acInput = Math.min(v, state.intInput); render(); }
function setInt(v) { state.intInput = v; state.acInput = Math.min(state.acInput, v); render(); }
function resetCounters() { state.acInput = 0; state.intInput = 10; render(); }
function saveSerie() {
  if (!state.selectedPlayerId || state.intInput === 0) return;
  var label = currentSerieLabel();
  if (!state.data[state.selectedPlayerId]) state.data[state.selectedPlayerId] = {};
  state.data[state.selectedPlayerId][label] = { tipo: state.currentTipo, ac: state.acInput, int: state.intInput };
  state.saveStatus = "saved";
  saveState();
  if (state.serieIdx < SERIES.length - 1) { state.serieIdx += 1; loadSerieValues(); }
  render();
  setTimeout(function () { state.saveStatus = "idle"; render(); }, 1200);
}
function toggleTable() { state.showTable = !state.showTable; render(); }
function toggleSettings() { state.showSettings = !state.showSettings; render(); }
function setObjetivo(which, pctValue) {
  var v = Number(pctValue) / 100;
  if (isNaN(v)) return;
  state.objetivos[which] = v;
  saveState();
  render();
}
function clearAllData() {
  if (confirm("¿Borrar todos los datos de tiro guardados? Esta acción no se puede deshacer.")) {
    state.data = {};
    saveState();
    render();
  }
}
function exportExcel() {
  try {
    var bytes = buildShootingXlsx(state);
    var blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var today = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "plantilla_tiro_" + today + ".xlsx";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    alert("No se ha podido generar el Excel: " + e.message);
  }
}

// ---------- render ----------
function render() {
  var root = document.getElementById("root");
  var html = "";

  if (state.storageError) {
    html += '<div class="error-banner">No se ha podido guardar el último cambio en este navegador.</div>';
  }

  // --- selector de jugadora ---
  html += '<div class="card">';
  html += '<span class="label">Jugadora</span>';
  html += '<div class="grid grid-3" style="margin-bottom:8px;">';
  state.players.forEach(function (p) {
    var active = p.id === state.selectedPlayerId ? " active" : "";
    html += '<button class="player-btn' + active + '" data-action="select-player" data-value="' + esc(p.id) + '">' + esc(p.name) + '</button>';
  });
  html += '</div>';
  html += '<div class="row">';
  html += '<input type="text" id="newPlayerInput" class="flex-1" placeholder="Añadir jugadora..." data-enter-action="add-player">';
  html += '<button class="btn-add" data-action="add-player">+</button>';
  html += '</div>';
  html += '</div>';

  if (state.selectedPlayerId) {
    // --- selector de serie ---
    html += '<div class="card">';
    html += '<span class="label">Serie</span>';
    html += '<div class="grid grid-4">';
    SERIES.forEach(function (label, i) {
      var saved = (state.data[state.selectedPlayerId] || {})[label];
      var active = i === state.serieIdx ? " active" : "";
      html += '<button class="serie-btn' + active + '" data-action="select-serie" data-value="' + i + '">';
      html += '<div class="serie-num">' + (i + 1) + '</div>';
      if (saved) {
        html += '<div class="serie-tipo ' + (saved.tipo === "T2" ? "t2" : "t3") + '">' + saved.tipo + '</div>';
        html += '<div class="check-badge">✓</div>';
      }
      html += '</button>';
    });
    html += '</div></div>';

    // --- panel de tiro ---
    html += '<div class="card">';
    html += '<div class="panel-head"><div><div class="serie-title">' + esc(currentSerieLabel()) + '</div>';
    html += '<div class="objetivo-sub">Objetivo: ' + Math.round(target() * 100) + '%</div></div>';
    html += '<div><div class="big-frac">' + state.acInput + '/' + state.intInput + '</div>';
    html += '<div class="big-pct ' + (reached() ? "reached" : "idle") + '">' + (state.intInput > 0 ? Math.round(pct() * 100) + "%" : "—") + '</div></div></div>';

    html += '<div class="grid grid-2" style="margin-bottom:14px;">';
    html += '<button class="tipo-toggle t2' + (state.currentTipo === "T2" ? " active" : "") + '" data-action="set-tipo" data-value="T2">T2 · obj ' + Math.round(state.objetivos.t2 * 100) + '%</button>';
    html += '<button class="tipo-toggle t3' + (state.currentTipo === "T3" ? " active" : "") + '" data-action="set-tipo" data-value="T3">T3 · obj ' + Math.round(state.objetivos.t3 * 100) + '%</button>';
    html += '</div>';

    html += '<div class="circles">';
    for (var c = 0; c < 10; c++) {
      var cls = "circle";
      if (c < state.acInput) cls += " made"; else if (c < state.intInput) cls += " miss";
      html += '<div class="' + cls + '"></div>';
    }
    html += '</div>';

    if (reached()) {
      html += '<div class="reached-banner">🎯 Objetivo alcanzado (' + state.acInput + '/' + state.intInput + ') — puede parar</div>';
    }

    html += '<div class="numpad-block"><div class="numpad-label">Aciertos — cuántas ha metido</div><div class="grid grid-6">';
    NUMBERS.forEach(function (num) {
      var disabled = num > state.intInput;
      var active = num === state.acInput ? " active" : "";
      html += '<button class="numpad-btn ac' + active + '" data-action="set-ac" data-value="' + num + '"' + (disabled ? " disabled" : "") + '>' + num + '</button>';
    });
    html += '</div></div>';

    html += '<div class="numpad-block"><div class="numpad-label">Intentos — cuántas ha tirado</div><div class="grid grid-6">';
    NUMBERS.forEach(function (num) {
      var active = num === state.intInput ? " active" : "";
      html += '<button class="numpad-btn int' + active + '" data-action="set-int" data-value="' + num + '">' + num + '</button>';
    });
    html += '</div></div>';

    html += '<div class="actions-row">';
    html += '<button class="btn btn-outline flex-1" data-action="reset-counters">Reiniciar</button>';
    html += '<button class="btn btn-dark flex-1" data-action="save-serie"' + (state.intInput === 0 ? " disabled" : "") + '>Guardar</button>';
    html += '</div>';
    if (state.saveStatus === "saved") html += '<div class="saved-msg">Guardado ✓</div>';
    html += '</div>';
  }

  // --- resumen del equipo ---
  html += '<div class="card card-flat">';
  html += '<button class="summary-toggle" data-action="toggle-table">Resumen del equipo<span>' + (state.showTable ? "▴" : "▾") + '</span></button>';
  if (state.showTable) {
    html += '<div style="overflow-x:auto;border-top:1px solid var(--line);"><table><thead><tr><th>Jugadora</th><th>T2</th><th>T3</th><th>General</th></tr></thead><tbody>';
    state.players.forEach(function (p) {
      var t2 = totalsFor(p.id, "T2"), t3 = totalsFor(p.id, "T3"), gen = generalFor(p.id);
      function cell(tot, obj) {
        if (tot.int === 0) return '<td class="cell-empty">—</td>';
        var cls = tot.pct >= obj ? "cell-ok" : "cell-bad";
        return '<td class="' + cls + '">' + tot.ac + '/' + tot.int + ' · ' + Math.round(tot.pct * 100) + '%</td>';
      }
      var rowActive = p.id === state.selectedPlayerId ? " active-row" : "";
      html += '<tr class="' + rowActive + '" data-action="select-player" data-value="' + esc(p.id) + '"><td>' + esc(p.name) + '</td>';
      html += cell(t2, state.objetivos.t2);
      html += cell(t3, state.objetivos.t3);
      html += gen.int > 0 ? '<td style="font-weight:700;">' + gen.ac + '/' + gen.int + ' · ' + Math.round(gen.pct * 100) + '%</td>' : '<td class="cell-empty">—</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // --- ajustes y exportación ---
  html += '<div class="card">';
  html += '<button class="settings-toggle" data-action="toggle-settings"><span>⚙ Objetivos</span><span>' + (state.showSettings ? "▴" : "▾") + '</span></button>';
  if (state.showSettings) {
    html += '<div class="settings-grid">';
    html += '<div><label>Objetivo T2 (%)</label><input type="number" min="0" max="100" value="' + Math.round(state.objetivos.t2 * 100) + '" data-change-action="set-objetivo-t2"></div>';
    html += '<div><label>Objetivo T3 (%)</label><input type="number" min="0" max="100" value="' + Math.round(state.objetivos.t3 * 100) + '" data-change-action="set-objetivo-t3"></div>';
    html += '</div>';
  }
  html += '<button class="btn-export" data-action="export-excel">⬇ Exportar a Excel</button>';
  html += '<button class="btn-clear" data-action="clear-data">🗑 Borrar todos los datos</button>';
  html += '</div>';

  root.innerHTML = html;
}

// ---------- event delegation (una sola vez) ----------
document.addEventListener("click", function (e) {
  var btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute("data-action");
  var value = btn.getAttribute("data-value");
  switch (action) {
    case "select-player": selectPlayer(value); break;
    case "add-player": addPlayer(); break;
    case "select-serie": selectSerie(Number(value)); break;
    case "set-tipo": setTipo(value); break;
    case "set-ac": setAc(Number(value)); break;
    case "set-int": setInt(Number(value)); break;
    case "reset-counters": resetCounters(); break;
    case "save-serie": saveSerie(); break;
    case "toggle-table": toggleTable(); break;
    case "toggle-settings": toggleSettings(); break;
    case "export-excel": exportExcel(); break;
    case "clear-data": clearAllData(); break;
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target && e.target.getAttribute && e.target.getAttribute("data-enter-action") === "add-player") {
    addPlayer();
  }
});
document.addEventListener("change", function (e) {
  var act = e.target.getAttribute && e.target.getAttribute("data-change-action");
  if (act === "set-objetivo-t2") setObjetivo("t2", e.target.value);
  if (act === "set-objetivo-t3") setObjetivo("t3", e.target.value);
});

// ---------- init ----------
loadState();
loadSerieValues();
render();
</script>
</body>
</html>
